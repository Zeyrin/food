# WHEEL UP! (wheel-up/): the Rust game. It only runs when the game or this file
# changes, so the food app's CI is untouched. `cargo fmt`, `clippy` and `test`
# below are the same commands a contributor runs from wheel-up/ before committing.
name: wheel-up

on:
  push:
    branches: ['**']
    paths: ['wheel-up/**', '.github/workflows/wheel-up.yml']
  pull_request:
    paths: ['wheel-up/**', '.github/workflows/wheel-up.yml']

defaults:
  run:
    working-directory: wheel-up

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The compiler and its components come from wheel-up/rust-toolchain.toml,
      # so CI lints with exactly what contributors run locally.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wheel-up

      # cpal needs ALSA, gamepad backends need udev, winit needs Wayland and xkbcommon.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
