<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#385e16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FFFood" />
    <meta name="application-name" content="FFFood" />
    <meta name="description" content="FFFood : choisissez vos repas de la semaine, générez votre liste de courses et cuisinez. Sans compte, gratuit, utilisable hors ligne en magasin." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.fffood.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FFFood" />
    <meta property="og:url" content="https://www.fffood.fr/" />
    <meta property="og:title" content="FFFood — repas de la semaine et liste de courses" />
    <meta property="og:description" content="Choisissez vos repas de la semaine, générez votre liste de courses et cuisinez. Sans compte, gratuit, utilisable hors ligne en magasin." />
    <meta property="og:image" content="https://www.fffood.fr/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FFFood" />
    <meta name="twitter:description" content="Repas de la semaine, liste de courses et mode cuisson, sans compte." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>FFFood — Repas de la semaine & liste de courses</title>
    <!--
      `data-mask-patterns` protège le secret de partage. Rybbit prend ce
      qui suit `#/` comme nom de page ; le lien qu'on envoie à son
      conjoint étant `#/f/<uuid>`, l'identifiant du foyer — celui qui
      donne accès à la liste — partait tel quel dans les statistiques,
      et se serait affiché dans notre propre rapport. Les adresses de
      cette forme sont désormais enregistrées comme « /f/* ».
    -->
    <script
      src="https://app.rybbit.io/api/script.js"
      data-site-id="4c5badb87633"
      data-mask-patterns='["/f/*"]'
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      L'app entière tient dans `#root`, que React remplace au démarrage : sans
      JavaScript, la page est vide, et un robot d'indexation qui n'exécute rien
      n'a aucun lien à suivre. Le catalogue prérendu (`scripts/prerender.mjs`)
      est la seule partie du site qui existe en HTML ; ce lien est la porte
      d'entrée vers lui, pour les robots comme pour un navigateur sans JS.
    -->
    <noscript>
      <p>
        FFFood a besoin de JavaScript. Les
        <a href="/recette/">recettes du catalogue</a> se lisent sans.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
