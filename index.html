<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La couleur du chrome navigateur (barre d'état, en-tête d'onglet)
         est celle du haut de la page, pas celle de la marque : un bandeau
         vert foncé au-dessus d'une app couleur parchemin se lisait comme
         une barre d'un autre logiciel. Une valeur par thème, comme le CSS. -->
    <meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FFFood" />
    <meta name="application-name" content="FFFood" />
    <meta name="description" content="FFFood: pick your meals for the week, generate your shopping list, and cook. No account, free, usable offline in-store." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.fffood.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FFFood" />
    <meta property="og:url" content="https://www.fffood.fr/" />
    <meta property="og:title" content="FFFood — weekly meals and shopping list" />
    <meta property="og:description" content="Pick your meals for the week, generate your shopping list, and cook. No account, free, usable offline in-store." />
    <meta property="og:image" content="https://www.fffood.fr/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FFFood" />
    <meta name="twitter:description" content="Weekly meals, shopping list, and cook mode, no account needed." />
    <!-- Les deux fontes que porte le premier écran : le corps de texte et
         le poids des titres. Sans préchargement, le navigateur ne les
         découvre qu'après avoir téléchargé puis analysé la feuille de
         style, et le texte reste en fonte système le temps de ce
         détour — on voit la page changer de typo sous les yeux. Les
         quatre autres graisses se chargent quand elles se présentent.
         `crossorigin` est obligatoire même pour un fichier du même
         domaine : les fontes se demandent en mode anonyme, et sans lui
         le fichier serait téléchargé deux fois. -->
    <link rel="preload" href="/fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>FFFood — Weekly meals & shopping list</title>
  <script>navigator.serviceWorker.register("service-worker.js")</script> 
  <link rel="manifest" href="manifest.json" />  <script src="https://app.rybbit.io/api/script.js" data-site-id="4c5badb87633" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      L'app entière tient dans `#root`, que React remplace au démarrage : sans
      JavaScript, la page est vide, et un robot d'indexation qui n'exécute rien
      n'a aucun lien à suivre. Le catalogue prérendu (`scripts/prerender.mjs`)
      est la seule partie du site qui existe en HTML ; ce lien est la porte
      d'entrée vers lui, pour les robots comme pour un navigateur sans JS.
    -->
    <noscript>
      <p>
        FFFood needs JavaScript. The
        <a href="/recette/">catalog recipes</a> can be read without it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
