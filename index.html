<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- La couleur du chrome navigateur (barre d'état, en-tête d'onglet)
         est celle du haut de la page, pas celle de la marque : un bandeau
         vert foncé au-dessus d'une app couleur parchemin se lisait comme
         une barre d'un autre logiciel. Une valeur par thème, comme le CSS. -->
    <meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FFFood" />
    <meta name="application-name" content="FFFood" />
    <meta name="description" content="FFFood : choisissez vos repas de la semaine, générez votre liste de courses et cuisinez. Sans compte, gratuit, utilisable hors ligne en magasin." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.fffood.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FFFood" />
    <meta property="og:url" content="https://www.fffood.fr/" />
    <meta property="og:title" content="FFFood — repas de la semaine et liste de courses" />
    <meta property="og:description" content="Choisissez vos repas de la semaine, générez votre liste de courses et cuisinez. Sans compte, gratuit, utilisable hors ligne en magasin." />
    <!-- Une affiche, pas l'icône : en DM, en story ou sur WhatsApp, un
         lien vers FFFood montrait le petit sac vert de l'app, qui ne dit
         rien de ce qu'on y fait. JPEG plutôt que WebP, que tous les
         robots d'aperçu ne lisent pas. -->
    <meta property="og:image" content="https://www.fffood.fr/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Qu'est-ce qu'on mange ce soir ? Décidé. — FFFood" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.fffood.fr/og.jpg" />
    <meta name="twitter:title" content="FFFood" />
    <meta name="twitter:description" content="Repas de la semaine, liste de courses et mode cuisson, sans compte." />
    <!-- Les deux fontes que porte le premier écran : le corps de texte et
         le poids des titres. Sans préchargement, le navigateur ne les
         découvre qu'après avoir téléchargé puis analysé la feuille de
         style, et le texte reste en fonte système le temps de ce
         détour — on voit la page changer de typo sous les yeux. Les
         quatre autres graisses se chargent quand elles se présentent.
         `crossorigin` est obligatoire même pour un fichier du même
         domaine : les fontes se demandent en mode anonyme, et sans lui
         le fichier serait téléchargé deux fois. -->
    <link rel="preload" href="/fonts/hanken-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>FFFood — Repas de la semaine & liste de courses</title>
    <!-- L'écran d'attente, écrit dans la page même : sans lui, tout ce qui
         précède le premier rendu React est une page blanche — une seconde
         en 4G, six en 3G lente, assez pour qu'un visiteur venu d'une vidéo
         reparte. Le sceau est celui de l'écran d'attente de l'app
         (`.attente`), que React pose à sa place sans saut visible. -->
    <style>
      html,body{margin:0;background:#fff8ef}
      .amorce{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;font:700 13px/1 system-ui,sans-serif;letter-spacing:.16em;color:#43493c}
      .amorce-sceau{width:68px;height:68px;border-radius:22px;background:#385e16;display:grid;place-items:center;animation:amorce 1.1s ease-in-out infinite alternate}
      @keyframes amorce{to{transform:scale(.93);opacity:.82}}
      @media (prefers-color-scheme:dark){html,body{background:#16150f}.amorce{color:#b8bcae}.amorce-sceau{background:#a6d47e}.amorce-sceau svg{stroke:#0c2000}}
      @media (prefers-reduced-motion:reduce){.amorce-sceau{animation:none}}
    </style>
    <script src="https://app.rybbit.io/api/script.js" data-site-id="4c5badb87633" defer></script>
  </head>
  <body>
    <div id="root">
      <div class="amorce" aria-hidden="true">
        <span class="amorce-sceau">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 11h-11z M8 8V5a4 4 0 018 0v3" /></svg>
        </span>
        FFFOOD
      </div>
    </div>
    <!--
      L'app entière tient dans `#root`, que React remplace au démarrage : sans
      JavaScript, la page est vide, et un robot d'indexation qui n'exécute rien
      n'a aucun lien à suivre. Le catalogue prérendu (`scripts/prerender.mjs`)
      est la seule partie du site qui existe en HTML ; ce lien est la porte
      d'entrée vers lui, pour les robots comme pour un navigateur sans JS.
    -->
    <noscript>
      <p>
        FFFood a besoin de JavaScript. Les
        <a href="/recette/">recettes du catalogue</a> se lisent sans.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
